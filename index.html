<!doctype html>
<html lang="de">
<head><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Inbox – Customer Operations</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#171b27;--muted:#737c8f;--line:#e2e6ee;--accent:#5b55e8;--green:#4d8a5d;--red:#b33b36;--amber:#a06a16}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:800}.logo{width:44px;height:44px;border-radius:14px;background:#171b27;color:white;display:grid;place-items:center;font-weight:900}.online{background:#edf8ef;color:#4d8a5d;padding:10px 16px;border-radius:22px;font-weight:650}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 72px)}aside{background:#fff;border-right:1px solid var(--line);padding:24px 16px}.nav{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:transparent;color:#596274;margin-bottom:6px}.nav.active,.nav:hover{background:#f0efff;color:var(--accent);font-weight:700}main{padding:30px;max-width:1500px;width:100%;margin:auto}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end}.hero h1{font-size:42px;margin:0 0 5px}.hero p{font-size:18px;color:var(--muted);margin:0}.primary{background:#171b27;color:white;border-radius:13px;padding:15px 20px;font-weight:750}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}.stat small{color:var(--muted);font-size:15px}.stat strong{display:block;font-size:38px;margin-top:8px}.green{color:var(--green)}.workspace{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.panelhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between}.panelhead h2{font-size:20px;margin:0}.tools{display:flex;gap:8px}.tools input,.tools select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}.ticket{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}.ticket:last-child{border-bottom:0}.ticket:hover{background:#fafaff}.ticket-main{min-width:0}.ticket-name{font-weight:800}.ticket-sub{font-weight:700;margin:5px 0}.preview{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badges{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#edf0f5;color:#566071}.high{background:#fde8e6;color:#ad3832}.low{background:#eaf6ec;color:#4d8a5d}.medium{background:#fff3db;color:#996514}.detail{padding:24px}.detail h2{margin:0 0 8px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.meta div{background:#f6f7fa;border-radius:12px;padding:12px}.label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.box{border:1px solid var(--line);border-radius:13px;padding:14px;margin:12px 0;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap}.secondary{background:#eef0f5;color:#303746;padding:11px 14px;border-radius:10px;font-weight:700}.danger{background:#fde8e6;color:#a83530;padding:11px 14px;border-radius:10px;font-weight:700}.success{background:#eaf6ec;color:#3f784e;padding:11px 14px;border-radius:10px;font-weight:700}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modalcard{background:#fff;border-radius:20px;padding:24px;max-width:600px;width:100%;max-height:90vh;overflow:auto}.modalcard h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}.field textarea{min-height:110px;resize:vertical}.toast{position:fixed;right:20px;bottom:20px;background:#171b27;color:white;padding:14px 18px;border-radius:12px;display:none;z-index:30}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.stats{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}main{padding:18px}.hero{align-items:start;flex-direction:column}.hero h1{font-size:34px}.top{padding:0 16px}}@media(max-width:520px){.stats{grid-template-columns:1fr}.panelhead{align-items:flex-start;flex-direction:column}.tools{width:100%}.tools input,.tools select{flex:1;min-width:0}.meta{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginScreen" style="position:fixed;inset:0;background:#f4f6fb;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="background:white;width:100%;max-width:420px;padding:32px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.12);">
    <h1 style="margin-top:0;">AI Inbox</h1>
    <p style="color:#6b7280;">Melde dich bei deinem Unternehmensbereich an.</p>

    <input id="companyName" placeholder="Unternehmen"
      style="width:100%;padding:16px;margin:8px 0;border:1px solid #ddd;border-radius:12px;box-sizing:border-box;">

    <input id="employeeName" placeholder="Dein Name"
      style="width:100%;padding:16px;margin:8px 0;border:1px solid #ddd;border-radius:12px;box-sizing:border-box;">
<input id="email" type="email" placeholder="E-Mail"
style="width:100%;padding:16px;margin:8px 0;border:1px solid #ddd;border-radius:12px;box-sizing:border-box;">

<input id="password" type="password" placeholder="Passwort"
style="width:100%;padding:16px;margin:8px 0;border:1px solid #ddd;border-radius:12px;box-sizing:border-box;">
    <button onclick="demoLogin()"
      style="width:100%;padding:16px;margin-top:12px;border:0;border-radius:12px;background:#171b27;color:white;font-size:17px;font-weight:700;">
      Einloggen
    </button>
    <button onclick="demoSignup()"
  style="width:100%;padding:16px;margin-top:12px;border-radius:14px;border:1px solid #ddd;background:white;font-size:18px;">
  Konto erstellen
</button>
  </div>
</div>

<script>
  
const SUPABASE_URL = "https://lpqxjbvyjeqygvkocusu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable__pf0X0kADogfKjQ6OBVdgg_FZ_pQMgN";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);
  let currentUserId = null;
async function demoLogin(){

  const company = document.getElementById("companyName").value.trim();
  const employee = document.getElementById("employeeName").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!company || !employee || !email || !password){
    alert("Bitte alle Felder ausfüllen.");
    return;
  }

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if(error){
    alert("Login fehlgeschlagen: " + error.message);
    return;
  }
const { data: userData } = await supabaseClient.auth.getUser();
currentUserId = userData.user?.id || null;
  localStorage.setItem("aiInboxCompany", company);
  localStorage.setItem("aiInboxEmployee", employee);

  document.getElementById("greeting").textContent =
    "Guten Morgen, " + employee + ".";

  document.getElementById("loginScreen").style.display = "none";
  loadTickets();
}
  async function demoSignup(){

  const company = document.getElementById("companyName").value;
  const employee = document.getElementById("employeeName").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if(!company || !employee || !email || !password){
    alert("Bitte alle Felder ausfüllen.");
    return;
  }

  const { error } = await supabaseClient.auth.signUp({
    email: email,
    password: password
  });

  if(error){
    alert("Registrierung fehlgeschlagen: " + error.message);
    return;
  }

  localStorage.setItem("aiInboxCompany", company);
  localStorage.setItem("aiInboxEmployee", employee);

  alert("Konto erstellt! Bitte bestätige deine E-Mail-Adresse.");
}


  
</script><header class="top"><div class="brand"><div class="logo">AI</div>AI Inbox</div><div class="online">● System online</div></header>
<div class="layout">
<aside>
<button class="nav active" onclick="showAll()">📥 Posteingang</button>
<button class="nav" onclick="filterTickets('high')">🔴 Hohe Priorität</button>
<button class="nav" onclick="filterTickets('unanswered')">✍️ Unbeantwortet</button>
<button class="nav" onclick="resetDemo()">↻ Demo zurücksetzen</button>
</aside>
<main>
<section class="hero"><div><h1 id="greeting">Guten Morgen.</h1><p>Hier ist dein Kundenservice für heute.</p></div><button class="primary" onclick="document.getElementById('modal').classList.add('open')">＋ Neue Anfrage</button></section>
<section class="stats">
<div class="stat"><small>Offene Anfragen</small><strong id="sOpen">0</strong><span class="green">↓ 12 % heute</span></div>
<div class="stat"><small>Hohe Priorität</small><strong id="sHigh">0</strong></div>
<div class="stat"><small>KI beantwortet</small><strong id="sAI">87 %</strong><span class="green">↑ 6 %</span></div>
<div class="stat"><small>Ø Antwortzeit</small><strong>4m</strong><span class="green">↓ 31 %</span></div>
</section>
<section class="workspace">
<div class="panel"><div class="panelhead"><h2>Posteingang</h2><div class="tools"><input id="search" placeholder="Suchen…" oninput="render()"><select id="filter" onchange="render()"><option value="all">Alle</option><option value="high">Hohe Priorität</option><option value="price">Preisfragen</option><option value="product">Produktfragen</option><option value="complaint">Reklamationen</option></select></div></div><div id="tickets"></div></div>
<div class="panel"><div id="detail" class="detail"><div class="empty">Wähle links eine Anfrage aus.</div></div></div>
</section>
</main></div>
<div id="modal" class="modal"><div class="modalcard"><h2>Neue Kundenanfrage</h2>
<div class="field"><label>Name</label><input id="newName" placeholder="z. B. Anna Schmidt"></div>
<div class="field"><label>E-Mail</label><input id="newEmail" placeholder="anna@example.de"></div>
<div class="field"><label>Betreff</label><input id="newSubject" placeholder="Worum geht es?"></div>
<div class="field"><label>Nachricht</label><textarea id="newMessage" placeholder="Kundennachricht…"></textarea></div>
<div class="actions"><button class="secondary" onclick="closeNew()">Abbrechen</button><button class="primary" onclick="createTicket()">Anfrage anlegen</button></div>
</div></div><div id="toast" class="toast"></div>
<script>
const seed=[
{id:1,name:"Max Müller",email:"max@example.de",subject:"Produkt funktioniert nicht",message:"Hallo, mein Gerät ist gestern angekommen und funktioniert leider nicht. Was können wir tun?",priority:"high",category:"Reklamation",status:"open",order:"DE-10482"},
{id:2,name:"Lisa Weber",email:"lisa@example.de",subject:"Was kostet das Modell X?",message:"Hallo, wie viel kostet das Modell X inklusive Versand?",priority:"low",category:"Preisfrage",status:"open",order:"—"},
{id:3,name:"Jonas Fischer",email:"jonas@example.de",subject:"Lieferzeit meiner Bestellung",message:"Können Sie mir sagen, wann meine Bestellung ungefähr ankommt?",priority:"medium",category:"Versand",status:"open",order:"DE-10491"},
{id:4,name:"Sarah Klein",email:"sarah@example.de",subject:"Welche Funktionen hat Produkt A?",message:"Ich interessiere mich für Produkt A. Welche Funktionen sind enthalten?",priority:"low",category:"Produktfrage",status:"open",order:"—"}
];
let tickets=[];
  async function loadTickets(){
  if(!currentUserId) return;

  const { data, error } = await supabaseClient
    .from("tickets")
    .select("*")
    .eq("user_id", currentUserId)
    .order("created_at", { ascending:false });

  if(error){
    console.log("Fehler beim Laden:", error.message);
    return;
  }
tickets = (data || []).map(t => ({
  ...t,
  order: t.orderNumber
}));
 
  if(tickets.length){
    selected = tickets[0].id;
  }

  render();
}

function save(){localStorage.setItem("aiInboxTickets",JSON.stringify(tickets))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function priorityText(p){return p==="high"?"HOCH":p==="medium"?"MITTEL":"NIEDRIG"}
function render(){
 const q=(document.getElementById("search")?.value||"").toLowerCase(), f=document.getElementById("filter")?.value||"all";
 let list=tickets.filter(t=>(!q||[t.name,t.email,t.subject,t.message,t.category].join(" ").toLowerCase().includes(q))&&(f==="all"||(f==="high"&&t.priority==="high")||(f==="price"&&t.category==="Preisfrage")||(f==="product"&&t.category==="Produktfrage")||(f==="complaint"&&t.category==="Reklamation")));
 document.getElementById("tickets").innerHTML=list.length?list.map(t=>`<div class="ticket" onclick="selectTicket(${t.id})"><div class="ticket-main"><div class="ticket-name">${esc(t.name)}</div><div class="ticket-sub">${esc(t.subject)}</div><div class="preview">${esc(t.message)}</div><div class="badges"><span class="badge ${t.priority}">${priorityText(t.priority)}</span><span class="badge">${esc(t.category)}</span>${t.status==="answered"?'<span class="badge low">BEANTWORTET</span>':''}</div></div><div style="color:#8b93a4;white-space:nowrap">${t.status==="answered"?"✓":"•"}</div></div>`).join(""):`<div class="empty">Keine Anfragen gefunden.</div>`;
 document.getElementById("sOpen").textContent=tickets.filter(t=>t.status!=="answered").length;
 document.getElementById("sHigh").textContent=tickets.filter(t=>t.priority==="high"&&t.status!=="answered").length;
 if(selected) showDetail(selected); else document.getElementById("detail").innerHTML='<div class="empty">Wähle links eine Anfrage aus.</div>';
}
function selectTicket(id){selected=id;showDetail(id)}
function showDetail(id){
 const t=tickets.find(x=>x.id===id); if(!t)return;
 document.getElementById("detail").innerHTML=`<h2>${esc(t.subject)}</h2><div style="color:#737c8f">${esc(t.name)} · ${esc(t.email)}</div>
 <div class="meta"><div><span class="label">Kategorie</span><b>${esc(t.category)}</b></div><div><span class="label">Priorität</span><b>${priorityText(t.priority)}</b></div><div><span class="label">Bestellnummer</span><b>${esc(t.order)}</b></div><div><span class="label">Status</span><b>${t.status==="answered"?"Beantwortet":"Offen"}</b></div></div>
 <div class="box"><span class="label">Kundennachricht</span>${esc(t.message)}</div>
 <div class="actions"><button class="primary" onclick="analyze(${t.id})">🤖 Mit KI analysieren</button><button class="secondary" onclick="draft(${t.id})">✍️ Antwortentwurf</button><button class="danger" onclick="removeTicket(${t.id})">Löschen</button></div>
<div id="aiBox"></div>
}
async function analyze(id){
  const t=tickets.find(x=>x.id===id);
  if(!t) return;

  const box=document.getElementById("aiBox");
  box.textContent="🤖 KI analysiert die Kundenanfrage...";

  try{
    const response=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message:t.message
      })
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error||"Fehler");
    }

    t.category=data.category;
    t.priority=data.priority;
    t.orderNumber=data.orderNumber;

    const { error: updateError } = await supabaseClient
  .from("tickets")
  .update({
    category: data.category,
    priority: data.priority,
    orderNumber: data.orderNumber,
    reply: data.reply
  })
  .eq("id", t.id)
  .eq("user_id", currentUserId);

if(updateError){
  throw new Error("Speichern fehlgeschlagen: " + updateError.message);
}

    box.innerHTML=`
      <strong>🤖 KI-Analyse</strong><br><br>
      Kategorie: <strong>${data.category}</strong><br>
      Priorität: <strong>${data.priority}</strong><br>
      Bestellnummer: <strong>${data.orderNumber||"Keine gefunden"}</strong><br><br>
      <strong>Antwortentwurf:</strong><br>
      ${data.reply}
    `;

  }catch(error){
    box.textContent="KI-Fehler: "+error.message;
  }
}

function draft(id){
 const t=tickets.find(x=>x.id===id);if(!t)return;
 let answer=t.category==="Preisfrage"?"Hallo "+t.name+", vielen Dank für Ihre Anfrage. Gerne informieren wir Sie über den aktuellen Preis und die Versandkosten.":t.category==="Reklamation"?"Hallo "+t.name+", vielen Dank für Ihre Nachricht. Es tut uns leid, dass das Produkt nicht funktioniert. Wir prüfen den Vorgang gerne anhand Ihrer Bestellnummer "+t.order+".":"Hallo "+t.name+", vielen Dank für Ihre Nachricht. Gerne helfen wir Ihnen weiter und prüfen Ihr Anliegen.";
 document.getElementById("aiBox").innerHTML=`<div class="box"><span class="label">KI-Antwortentwurf</span><p>${esc(answer)}</p><div class="actions"><button class="success" onclick="answer(${id})">✓ Als beantwortet markieren</button><button class="secondary" onclick="copyText(${JSON.stringify(answer)})">Kopieren</button></div></div>`;
}
function answer(id){let t=tickets.find(x=>x.id===id);if(t){t.status="answered";save();render();toast("Anfrage als beantwortet markiert ✓")}}
function copyText(text){navigator.clipboard?.writeText(text);toast("Antwort kopiert ✓")}
function removeTicket(id){tickets=tickets.filter(t=>t.id!==id);selected=tickets[0]?.id||null;save();render();toast("Anfrage gelöscht")}
function openNew(){document.getElementById("modal").classList.add("open")}
function closeNew(){document.getElementById("modal").classList.remove("open")}
async function createTicket(){

  const name = document.getElementById("newName").value.trim();
  const email = document.getElementById("newEmail").value.trim();
  const subject = document.getElementById("newSubject").value.trim();
  const message = document.getElementById("newMessage").value.trim();

  if(!message){
    alert("Bitte eine Nachricht eingeben.");
    return;
  }

  if(!currentUserId){
    alert("Bitte zuerst einloggen.");
    return;
  }

  const { data, error } = await supabaseClient
    .from("tickets")
    .insert({
      name: name || "Neuer Kunde",
      email: email || "kunde@example.de",
      subject: subject || "Neue Anfrage",
      message: message,
      category: "Unkategorisiert",
      priority: "medium",
      orderNumber: "__",
      reply: "",
      status: "open",
      user_id: currentUserId
    })
    .select()
    .single();

  if(error){
    alert("Fehler beim Speichern: " + error.message);
    return;
  }

  const ticket = {
    id: data.id,
    name: data.name,
    email: data.email,
    subject: data.subject,
    message: data.message,
    priority: data.priority,
    category: data.category,
    status: data.status,
    order: data.orderNumber,
    reply: data.reply,
    user_id: data.user_id
  };

  tickets.unshift(ticket);

  selected = ticket.id;

  closeNew();

  document.getElementById("newName").value = "";
  document.getElementById("newEmail").value = "";
  document.getElementById("newSubject").value = "";
  document.getElementById("newMessage").value = "";

  render();

  toast("Neue Anfrage gespeichert ✓");
}
function filterTickets(type){document.getElementById("filter").value=type==="high"?"high":"all";if(type==="unanswered")tickets=tickets;render()}
function showAll(){document.getElementById("filter").value="all";document.getElementById("search").value="";render()}
function resetDemo(){if(confirm("Demo wirklich zurücksetzen?")){tickets=JSON.parse(JSON.stringify(seed));selected=1;save();render();toast("Demo zurückgesetzt")}}
function toast(s){let x=document.getElementById("toast");x.textContent=s;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
render();
</script>
</body></html>
