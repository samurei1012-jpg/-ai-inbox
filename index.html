<!doctype html>
<html lang="de">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Inbox – Customer Operations</title>

<style>
:root{--bg:#0f1117;--card:#171b24;--ink:#f5f7fb;--muted:#9aa4b2;--line:#29313d;--green:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.top{height:64px;background:#fff;border-bottom:1px solid #e6eaf0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-shadow:0 1px 8px rgba(23,27,39,.04)}
.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:800}
.logo{width:44px;height:44px;border-radius:14px;background:#2563eb;color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 4px 12px rgba(37,99,235,.25)}
.online{background:#ecfdf5;color:#15803d;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 64px)}
aside{background:#111827;border-right:1px solid #1f2937}
.nav{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:6px;border-radius:10px;color:#cbd5e1;background:transparent}
.nav.active,.nav:hover{background:#1f2937;color:#fff}
main{padding:32px;max-width:1500px;width:100%;margin:0 auto}
.hero{display:flex;justify-content:space-between;align-items:center;gap:24px}
.hero h1{font-size:40px;margin:0 0 6px;font-weight:800;letter-spacing:-1px}
.hero p{font-size:16px;color:var(--muted);margin:0}
  .primary{background:#171b27;color:white;border-radius:14px;padding:12px 18px;font-weight:700}
.primary:disabled{opacity:.6;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0}
.stat{background:#fff;color:#172033;border:1px solid #e6eaf0;border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(15,23,42,.06)}
.stat small{color:var(--muted);font-size:15px}
.stat strong{display:block;font-size:34px;margin-top:4px;font-weight:800;letter-spacing:-.5px}
.green{color:var(--green)}
.workspace{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}
.panel{background:#fff;border:1px solid #e6eaf0;border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.06);overflow:hidden}
.panelhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between}
.panelhead h2{font-size:20px;margin:0}
.tools{display:flex;gap:8px}
.tools input,.tools select{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.ticket{padding:18px 20px;border-bottom:1px solid #eef1f5;transition:background .15s ease}
.ticket:hover{background:#f7f9fc;transform:translateX(2px);transition:.15s ease}
.ticket-main{min-width:0}
.ticket-name{font-weight:800;font-size:15px;color:var(--ink)}
.ticket-sub{font-weight:650;margin:5px 0 0;color:var(--muted);font-size:13px}
.preview{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;line-height:1}
.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:16px 20px;background:#f8fafc;border-top:1px solid #eef1f5}
.medium{background:#fff3db;color:#996514}
.low{background:#eaf6ec;color:#4d8a5d}
.detail{padding:26px}
.detail h2{margin:0 0 8px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
.meta div{background:#f6f7fa;border-radius:12px;padding:12px}
.label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.box{border:1px solid var(--line);border-radius:13px;padding:14px;margin:12px 0;background:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.secondary{background:#eef0f5;color:#303746;padding:11px 14px;border-radius:10px;font-weight:700}
.danger{background:#fde8e6;color:#a83530;padding:11px 14px;border-radius:10px;font-weight:700}
.success{background:#eaf6ec;color:#3f784e;padding:11px 14px;border-radius:10px;font-weight:700}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.open{display:flex}
.modalcard{background:#fff;border-radius:20px;padding:24px;max-width:600px;width:100%;max-height:90vh;overflow:auto}
.field{margin:12px 0}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px}
.field textarea{min-height:110px;resize:vertical}
.toast{position:fixed;right:20px;bottom:20px;background:#171b27;color:white;padding:14px 18px;border-radius:12px;display:none;z-index:30}
.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.stats{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}main{padding:18px}.hero{align-items:start;flex-direction:column}.hero h1{font-size:34px}.top{padding:0 16px}}
@media(max-width:520px){.stats{grid-template-columns:1fr}.panelhead{align-items:flex-start;flex-direction:column}.tools{width:100%}.tools input,.tools select{flex:1;min-width:0}.meta{grid-template-columns:1fr}}
</style>
</head>

<body>

<div id="loginScreen" style="position:fixed;inset:0;background:#f4f6fb;z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px">
<div style="background:white;width:100%;max-width:420px;padding:32px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.12)">
<h1 style="margin-top:0">AI Inbox</h1>
<p style="color:#6b7280">Melde dich bei deinem Unternehmensbereich an.</p>

<input id="companyName" placeholder="Unternehmen" style="width:100%;padding:16px;margin:8px 0;border:1px solid #ddd;border-radius:12px">
<input id="employeeName" placeholder="Dein Name" style="width:100%;padding:16px;margin:8px 0;border:1px solid #ddd;border-radius:12px">
<input id="email" type="email" placeholder="E-Mail" style="width:100%;padding:16px;margin:8px 0;border:1px solid #ddd;border-radius:12px">
<input id="password" type="password" placeholder="Passwort" style="width:100%;padding:16px;margin:8px 0;border:1px solid #ddd;border-radius:12px">

<button onclick="demoLogin()" style="width:100%;padding:16px;margin-top:12px;border:0;border-radius:12px;background:#171b27;color:white;font-size:17px;font-weight:700">
Einloggen
</button>

<button onclick="demoSignup()" style="width:100%;padding:16px;margin-top:12px;border-radius:14px;border:1px solid #ddd;background:white;font-size:18px">
Konto erstellen
</button>
</div>
</div>

<script>
const SUPABASE_URL="https://lpqxjbvyjeqygvkocusu.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable__pf0X0kADogfKjQ6OBVdgg_FZ_pQMgN";

const supabaseClient=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);

let currentUserId=null;

async function demoLogin(){
const company=document.getElementById("companyName").value.trim();
const employee=document.getElementById("employeeName").value.trim();
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!company||!employee||!email||!password){
alert("Bitte alle Felder ausfüllen.");
return;
}

const {error}=await supabaseClient.auth.signInWithPassword({email,password});

if(error){
alert("Login fehlgeschlagen: "+error.message);
return;
}

const {data:userData}=await supabaseClient.auth.getUser();
currentUserId=userData.user?.id||null;

localStorage.setItem("aiInboxCompany",company);
localStorage.setItem("aiInboxEmployee",employee);

document.getElementById("greeting").textContent="Guten Morgen, "+employee+".";
document.getElementById("loginScreen").style.display="none";

await loadTickets();
}

async function demoSignup(){
const company=document.getElementById("companyName").value.trim();
const employee=document.getElementById("employeeName").value.trim();
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!company||!employee||!email||!password){
alert("Bitte alle Felder ausfüllen.");
return;
}

const {error}=await supabaseClient.auth.signUp({email,password});

if(error){
alert("Registrierung fehlgeschlagen: "+error.message);
return;
}

localStorage.setItem("aiInboxCompany",company);
localStorage.setItem("aiInboxEmployee",employee);

alert("Konto erstellt! Bitte bestätige deine E-Mail-Adresse.");
}
</script>

<header class="top">
<div class="brand"><div class="logo">AI</div>AI Inbox</div>
<div class="online">● System online</div>
</header>

<div class="layout">
<aside>
<button class="nav active" onclick="showAll()">📥 Posteingang</button>
<button class="nav" onclick="filterTickets('high')">🔴 Hohe Priorität</button>
<button class="nav" onclick="filterTickets('unanswered')">✍️ Unbeantwortet</button>
<button class="nav" onclick="resetDemo()">↻ Demo zurücksetzen</button>
</aside>

<main>
<section class="hero">
<div>
<h1 id="greeting">Guten Morgen.</h1>
<p>Hier ist dein Kundenservice für heute.</p>
</div>
<button class="primary" onclick="openNew()">＋ Neue Anfrage</button>
</section>

<section class="stats">
<div class="stat"><small>Offene Anfragen</small><strong id="sOpen">0</strong></div>
<div class="stat"><small>Hohe Priorität</small><strong id="sHigh">0</strong></div>
<div class="stat"><small>KI beantwortet</small><strong id="sAI">0</strong></div>
<div class="stat"><small>Ø Antwortzeit</small><strong>4m</strong></div>
</section>

<section class="workspace">
<div class="panel">
<div class="panelhead">
<h2>Posteingang</h2>
<div class="tools">
<input id="search" placeholder="Suchen…" oninput="render()">
<select id="filter" onchange="render()">
<option value="all">Alle</option>
<option value="high">Hohe Priorität</option>
<option value="price">Preisfragen</option>
<option value="product">Produktfragen</option>
<option value="complaint">Reklamationen</option>
</select>
</div>
</div>
<div id="tickets"></div>
</div>

<div class="panel">
<div id="detail" class="detail">
<div class="empty">Wähle links eine Anfrage aus.</div>
</div>
</div>
</section>
</main>
</div>

<div id="modal" class="modal">
<div class="modalcard">
<h2>Neue Kundenanfrage</h2>

<div class="field"><label>Name</label><input id="newName" placeholder="z. B. Anna Schmidt"></div>
<div class="field"><label>E-Mail</label><input id="newEmail" placeholder="anna@example.de"></div>
<div class="field"><label>Betreff</label><input id="newSubject" placeholder="Worum geht es?"></div>
<div class="field"><label>Nachricht</label><textarea id="newMessage" placeholder="Kundennachricht…"></textarea></div>

<div class="actions">
<button class="secondary" onclick="closeNew()">Abbrechen</button>
<button class="primary" onclick="createTicket()">Anfrage anlegen</button>
</div>
</div>
</div>

<div id="toast" class="toast"></div>

<script>

let tickets=[];
let selected=null;

function esc(s){
return String(s??"").replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));
}

function normalizePriority(p){
p=String(p||"").toLowerCase();
if(p==="hoch"||p==="high")return"high";
if(p==="mittel"||p==="medium")return"medium";
return"low";
}

function priorityText(p){
p=normalizePriority(p);
return p==="high"?"HOCH":p==="medium"?"MITTEL":"NIEDRIG";
}

async function loadTickets(){
if(!currentUserId)return;

const {data,error}=await supabaseClient
.from("tickets")
.select("*")
.eq("user_id",currentUserId)
.order("created_at",{ascending:false});

if(error){
alert("Tickets konnten nicht geladen werden: "+error.message);
return;
}

tickets=(data||[]).map(t=>({
...t,
name:"Kunde",
email:"",
subject:"Kundenanfrage",
priority:normalizePriority(t.priority),
status:t.reply?"answered":"open",
order:t.orderNumber||""
}));

selected=tickets.length?tickets[0].id:null;
render();
}

function render(){
const q=(document.getElementById("search")?.value||"").toLowerCase();
const f=document.getElementById("filter")?.value||"all";

const list=tickets.filter(t=>{
const text=[t.name,t.email,t.subject,t.message,t.category].join(" ").toLowerCase();

if(q&&!text.includes(q))return false;
if(f==="high"&&t.priority!=="high")return false;
if(f==="price"&&t.category!=="Preisfrage")return false;
if(f==="product"&&t.category!=="Produktfrage")return false;
if(f==="complaint"&&t.category!=="Reklamation")return false;

return true;
});

document.getElementById("tickets").innerHTML=list.length?
list.map(t=>`
<div class="ticket" onclick="selectTicket('${t.id}')">
<div class="ticket-main">
<div class="ticket-name">${esc(t.name)}</div>
<div class="ticket-sub">${esc(t.subject)}</div>
<div class="preview">${esc(t.message)}</div>
<div class="badges">
<span class="badge ${t.priority}">${priorityText(t.priority)}</span>
<span class="badge">${esc(t.category)}</span>
${t.status==="answered"?'<span class="badge low">BEANTWORTET</span>':""}
</div>
</div>
<div>${t.status==="answered"?"✓":"•"}</div>
</div>
`).join(""):
'<div class="empty">Keine Anfragen gefunden.</div>';

document.getElementById("sOpen").textContent=
tickets.filter(t=>t.status!=="answered").length;

document.getElementById("sHigh").textContent=
tickets.filter(t=>t.priority==="high"&&t.status!=="answered").length;

document.getElementById("sAI").textContent=
tickets.filter(t=>t.reply).length;

if(selected)showDetail(selected);
}

function selectTicket(id){
selected=id;
showDetail(id);
}

function showDetail(id){
const t=tickets.find(x=>String(x.id)===String(id));
if(!t)return;

document.getElementById("detail").innerHTML=`
<h2>${esc(t.subject)}</h2>
<div style="color:#737c8f">${esc(t.name)}${t.email?" · "+esc(t.email):""}</div>

<div class="meta">
<div><span class="label">Kategorie</span><b>${esc(t.category)}</b></div>
<div><span class="label">Priorität</span><b>${priorityText(t.priority)}</b></div>
<div><span class="label">Bestellnummer</span><b>${esc(t.order||"Keine")}</b></div>
<div><span class="label">Status</span><b>${t.status==="answered"?"Beantwortet":"Offen"}</b></div>
</div>

<div class="box">
<span class="label">Kundennachricht</span>
${esc(t.message)}
</div>

<div class="actions">
<button class="primary" onclick="analyze('${t.id}')">🤖 Mit KI analysieren</button>
<button class="secondary" onclick="draft('${t.id}')">✍️ Antwortentwurf</button>
<button class="danger" onclick="removeTicket('${t.id}')">Löschen</button>
</div>

<div id="aiBox">
${t.reply?`<div class="box"><span class="label">Antwortentwurf</span>${esc(t.reply)}</div>`:""}
</div>
`;
}

async function analyze(id){
const t=tickets.find(x=>String(x.id)===String(id));
if(!t)return;

const box=document.getElementById("aiBox");
box.textContent="🤖 KI analysiert die Kundenanfrage...";

try{
const response=await fetch("/api/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:t.message})
});

const data=await response.json();

if(!response.ok)throw new Error(data.error||"Fehler");

t.category=data.category||"Sonstiges";
t.priority=normalizePriority(data.priority);
t.order=data.orderNumber||"";
t.reply=data.reply||"";

const dbPriority=t.priority==="high"?"HOCH":t.priority==="medium"?"MITTEL":"NIEDRIG";

const {error}=await supabaseClient
.from("tickets")
.update({
category:t.category,
priority:dbPriority,
orderNumber:t.order,
reply:t.reply
})
.eq("id",t.id)
.eq("user_id",currentUserId);

if(error)throw new Error("Speichern fehlgeschlagen: "+error.message);

showDetail(t.id);
toast("KI-Analyse gespeichert ✓");

}catch(error){
box.textContent="KI-Fehler: "+error.message;
}
}

function draft(id){
const t=tickets.find(x=>String(x.id)===String(id));
if(!t)return;

const answer=t.category==="Preisfrage"
?"Hallo "+t.name+", vielen Dank für Ihre Anfrage. Gerne informieren wir Sie über den aktuellen Preis und die Versandkosten."
:t.category==="Reklamation"
?"Hallo "+t.name+", vielen Dank für Ihre Nachricht. Es tut uns leid, dass das Produkt nicht funktioniert. Wir prüfen Ihr Anliegen gerne anhand Ihrer Bestellnummer "+t.order+"."
:"Hallo "+t.name+", vielen Dank für Ihre Nachricht. Gerne helfen wir Ihnen weiter und prüfen Ihr Anliegen.";

document.getElementById("aiBox").innerHTML=`
<div class="box">
<span class="label">Antwortentwurf</span>
<p>${esc(answer)}</p>
<div class="actions">
<button class="success" onclick="answer('${t.id}')">✓ Als beantwortet markieren</button>
<button class="secondary" onclick='copyText(${JSON.stringify(answer)})'>Kopieren</button>
</div>
</div>`;
}

async function answer(id){
const t=tickets.find(x=>String(x.id)===String(id));
if(!t)return;

t.status="answered";
if(!t.reply)t.reply="Antwortentwurf erstellt.";

const {error}=await supabaseClient
.from("tickets")
.update({reply:t.reply})
.eq("id",t.id)
.eq("user_id",currentUserId);

if(error){
alert("Fehler beim Speichern: "+error.message);
return;
}

render();
toast("Anfrage als beantwortet markiert ✓");
}

async function copyText(text){
try{
await navigator.clipboard.writeText(text);
toast("Antwort kopiert ✓");
}catch(e){
alert("Kopieren war nicht möglich.");
}
}

async function removeTicket(id){
if(!confirm("Diese Anfrage wirklich löschen?"))return;

const {error}=await supabaseClient
.from("tickets")
.delete()
.eq("id",id)
.eq("user_id",currentUserId);

if(error){
alert("Löschen fehlgeschlagen: "+error.message);
return;
}

tickets=tickets.filter(t=>String(t.id)!==String(id));
selected=tickets[0]?.id||null;
render();
toast("Anfrage gelöscht ✓");
}

function openNew(){
document.getElementById("modal").classList.add("open");
}

function closeNew(){
document.getElementById("modal").classList.remove("open");
}

async function createTicket(){

const name=document.getElementById("newName").value.trim();
const email=document.getElementById("newEmail").value.trim();
const subject=document.getElementById("newSubject").value.trim();
const message=document.getElementById("newMessage").value.trim();

if(!message){
alert("Bitte eine Nachricht eingeben.");
return;
}

if(!currentUserId){
alert("Bitte zuerst einloggen.");
return;
}

const button=document.querySelector("#modal .primary");
button.disabled=true;
button.textContent="Wird gespeichert...";

try{

const {data,error}=await supabaseClient
.from("tickets")
.insert({
message:message,
category:"Unkategorisiert",
priority:"MITTEL",
orderNumber:"",
reply:"",
user_id:currentUserId
})
.select()
.single();

if(error)throw new Error(error.message);

const ticket={
id:data.id,
name:name||"Neuer Kunde",
email:email||"",
subject:subject||"Neue Anfrage",
message:message,
priority:"medium",
category:data.category||"Unkategorisiert",
status:"open",
order:data.orderNumber||"",
reply:"",
user_id:data.user_id
};

tickets.unshift(ticket);
selected=ticket.id;

closeNew();

document.getElementById("newName").value="";
document.getElementById("newEmail").value="";
document.getElementById("newSubject").value="";
document.getElementById("newMessage").value="";

render();
toast("Neue Anfrage gespeichert ✓");

}catch(error){

alert("Fehler beim Speichern: "+error.message);

}finally{

button.disabled=false;
button.textContent="Anfrage anlegen";

}
}

function filterTickets(type){

if(type==="unanswered"){
const original=tickets;
tickets=original.filter(t=>t.status!=="answered");
render();
tickets=original;
return;
}

if(type==="high"){
const original=tickets;
tickets=original.filter(t=>t.priority==="high");
render();
tickets=original;
return;
}

render();
}

function showAll(){
document.getElementById("filter").value="all";
render();
}

async function resetDemo(){

if(!confirm("Demo wirklich zurücksetzen?"))return;
if(!currentUserId)return;

const {error}=await supabaseClient
.from("tickets")
.delete()
.eq("user_id",currentUserId);

if(error){
alert("Zurücksetzen fehlgeschlagen: "+error.message);
return;
}

tickets=[];
selected=null;
render();
toast("Tickets zurückgesetzt");
}

function toast(message){
const x=document.getElementById("toast");
x.textContent=message;
x.style.display="block";
setTimeout(()=>x.style.display="none",2500);
}

render();

</script>
</body>
</html>
