<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Inbox – Samuel</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#171a24;--muted:#7b8497;--line:#e5e8ef;--accent:#4f46e5;--green:#4d8b62;--red:#b63c3c;--yellow:#a87517}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}
header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:800}.logo{width:42px;height:42px;border-radius:13px;background:#171a24;color:#fff;display:grid;place-items:center;font-weight:900}
.online{background:#edf8f0;color:#4d8b62;border-radius:22px;padding:10px 16px;font-size:14px}.dot{display:inline-block;width:10px;height:10px;background:#4d8b62;border-radius:50%;margin-right:7px}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 72px)}
aside{background:#fff;border-right:1px solid var(--line);padding:24px 14px}.nav{display:flex;gap:12px;align-items:center;padding:13px 14px;border-radius:12px;color:#626b7d;margin-bottom:6px}.nav.active{background:#eef0ff;color:var(--accent);font-weight:700}.nav button{background:none}
main{padding:30px;max-width:1400px;width:100%;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.welcome h1{font-size:42px;margin:0 0 8px}.sub{color:var(--muted);font-size:18px}.primary{background:#171a24;color:#fff;padding:14px 20px;border-radius:14px;font-weight:700}
.greeting{display:inline-block;animation:float 2.4s ease-in-out infinite}@keyframes float{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-4px)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.stat,.panel,.ticket{background:var(--card);border:1px solid var(--line);border-radius:18px}.stat{padding:22px}.stat span{color:var(--muted)}.stat b{display:block;font-size:34px;margin-top:8px}
.panel{overflow:hidden}.panelhead{padding:20px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.panelhead h2{margin:0}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input,.controls select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
.ticket{border-radius:0;border-width:0 0 1px 0;padding:18px 24px;display:flex;justify-content:space-between;gap:15px;transition:.15s}.ticket:hover{background:#fafaff}.ticket:last-child{border-bottom:0}.left{min-width:0}.sender{font-weight:800}.subject{font-weight:700;margin:5px 0}.preview{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:680px}.tags{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}.tag{font-size:12px;padding:6px 9px;border-radius:999px;background:#eef0f4;color:#5f687a}.high{background:#fde9e7;color:#a33b35}.low{background:#e9f7ed;color:#4d805c}.mid{background:#fff4dc;color:#9a6a16}.empty{padding:40px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.box{background:#fff;border-radius:20px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:24px}.box h2{margin-top:0}.field{margin:14px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px}.field textarea{min-height:120px;resize:vertical}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.secondary{background:#eef0f4;padding:11px 15px;border-radius:10px}.danger{background:#fde9e7;color:#a33b35;padding:11px 15px;border-radius:10px}.ai{background:#f1f0ff;border:1px solid #dedcff;border-radius:14px;padding:16px;margin-top:16px}.ai b{color:#4f46e5}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.reply{background:#f7f8fb;border-radius:12px;padding:13px;margin-top:10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#171a24;color:#fff;padding:13px 18px;border-radius:12px;display:none;z-index:30}.toast.show{display:block}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:none}main{padding:18px}.stats{grid-template-columns:1fr 1fr}.welcome{align-items:start}.welcome h1{font-size:34px}.preview{max-width:55vw}.detailgrid{grid-template-columns:1fr}header{padding:0 16px}}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.stat b{font-size:28px}.ticket{padding:16px}.online{display:none}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">AI</div>AI Inbox</div><div class="online"><span class="dot"></span>System online</div></header>
<div class="layout">
<aside>
<div class="nav active">📥 Posteingang <span id="navCount" style="margin-left:auto"></span></div>
<div class="nav">⭐ Priorität</div>
<div class="nav">🤖 KI-Antworten</div>
<div class="nav">📊 Statistiken</div>
<div class="nav">⚙️ Einstellungen</div>
</aside>
<main>
<section class="welcome"><div><h1><span class="greeting">Hallo Samuel 👋</span></h1><div class="sub">Dein Kundenservice für heute.</div></div><button class="primary" onclick="openNew()">＋ Neue Anfrage</button></section>
<section class="stats">
<div class="stat"><span>Offene Anfragen</span><b id="openStat">0</b></div>
<div class="stat"><span>Hohe Priorität</span><b id="highStat">0</b></div>
<div class="stat"><span>KI beantwortet</span><b id="aiStat">0%</b></div>
<div class="stat"><span>Ø Antwortzeit</span><b>4m</b></div>
</section>
<section class="panel">
<div class="panelhead"><h2>Posteingang</h2><div class="controls"><input id="search" placeholder="Suchen…" oninput="render()"><select id="filter" onchange="render()"><option value="all">Alle Anfragen</option><option value="high">Hohe Priorität</option><option value="open">Offen</option><option value="answered">Beantwortet</option></select></div></div>
<div id="tickets"></div>
</section>
</main></div></div>

<div class="modal" id="newModal"><div class="box"><h2>Neue Test-E-Mail</h2>
<div class="field"><label>Kunde</label><input id="nName" value="Testkunde"></div>
<div class="field"><label>E-Mail</label><input id="nEmail" value="kunde@example.com"></div>
<div class="field"><label>Betreff</label><input id="nSubject" placeholder="z. B. Produkt funktioniert nicht"></div>
<div class="field"><label>Nachricht</label><textarea id="nBody" placeholder="Schreibe hier eine Test-E-Mail…"></textarea></div>
<div class="actions"><button class="secondary" onclick="closeNew()">Abbrechen</button><button class="primary" onclick="createTicket()">Anfrage erstellen</button></div>
</div></div>

<div class="modal" id="detailModal"><div class="box" id="detailBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const seed=[
{id:1,name:"Max Müller",email:"max@example.com",subject:"Produkt funktioniert nicht",body:"Hallo, mein Gerät ist gestern angekommen und funktioniert leider nicht. Was können wir tun?",status:"open",priority:"high",category:"Reklamation",ai:false},
{id:2,name:"Lisa Weber",email:"lisa@example.com",subject:"Was kostet das Produkt?",body:"Hallo, wie viel kostet das Produkt inklusive Versand?",status:"open",priority:"low",category:"Preisfrage",ai:false},
{id:3,name:"Tom Schneider",email:"tom@example.com",subject:"Lieferstatus meiner Bestellung",body:"Können Sie mir sagen, wann meine Bestellung #48291 ankommt?",status:"answered",priority:"mid",category:"Lieferung",ai:true}
];
let tickets=JSON.parse(localStorage.getItem("aiInboxTickets")||"null")||seed;
let selected=null;
function save(){localStorage.setItem("aiInboxTickets",JSON.stringify(tickets))}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
function classify(t){const s=(t.subject+" "+t.body).toLowerCase();let category="Allgemein",priority="low";if(/kaputt|defekt|funktioniert nicht|reklam|beschwer/.test(s)){category="Reklamation";priority="high"}else if(/preis|kosten|€|euro/.test(s)){category="Preisfrage";priority="low"}else if(/bestellung|liefer|versand|paket/.test(s)){category="Lieferung";priority="mid"}else if(/rechnung|zahlung|bezahlen/.test(s)){category="Zahlung";priority="mid"}else if(/dring|sofort|wichtig/.test(s)){priority="high"}return{category,priority}}
function aiAnswer(t){if(t.category==="Reklamation")return`Hallo ${t.name},\n\nvielen Dank für Ihre Nachricht. Es tut uns leid, dass das Produkt nicht funktioniert. Wir prüfen den Fall gerne und helfen Ihnen schnellstmöglich weiter.\n\nViele Grüße\nKundenservice`;if(t.category==="Preisfrage")return`Hallo ${t.name},\n\nvielen Dank für Ihre Anfrage. Gerne informieren wir Sie über den aktuellen Preis und die Versandkosten.\n\nViele Grüße\nKundenservice`;if(t.category==="Lieferung")return`Hallo ${t.name},\n\nvielen Dank für Ihre Nachricht. Wir prüfen den Lieferstatus Ihrer Bestellung und melden uns mit den aktuellen Informationen.\n\nViele Grüße\nKundenservice`;return`Hallo ${t.name},\n\nvielen Dank für Ihre Nachricht. Wir haben Ihre Anfrage erhalten und kümmern uns darum.\n\nViele Grüße\nKundenservice`}
function render(){const q=document.getElementById("search").value.toLowerCase();const f=document.getElementById("filter").value;let arr=tickets.filter(t=>(t.name+t.subject+t.body).toLowerCase().includes(q));if(f==="high")arr=arr.filter(t=>t.priority==="high");if(f==="open")arr=arr.filter(t=>t.status==="open");if(f==="answered")arr=arr.filter(t=>t.status==="answered");document.getElementById("tickets").innerHTML=arr.length?arr.map(t=>`<div class="ticket" onclick="openDetail(${t.id})"><div class="left"><div class="sender">${esc(t.name)} <span style="color:#a2a9b8;font-weight:400;font-size:13px">• ${esc(t.email)}</span></div><div class="subject">${esc(t.subject)}</div><div class="preview">${esc(t.body)}</div><div class="tags"><span class="tag ${t.priority}">${t.priority==="high"?"HOCH":t.priority==="mid"?"MITTEL":"NIEDRIG"}</span><span class="tag">${esc(t.category)}</span>${t.ai?'<span class="tag low">KI beantwortet</span>':""}</div></div><div style="color:#a2a9b8;font-size:13px">jetzt</div></div>`).join(""):`<div class="empty">Keine Anfragen gefunden.</div>`;document.getElementById("openStat").textContent=tickets.filter(t=>t.status==="open").length;document.getElementById("highStat").textContent=tickets.filter(t=>t.priority==="high"&&t.status==="open").length;document.getElementById("aiStat").textContent=Math.round(tickets.filter(t=>t.ai).length/Math.max(tickets.length,1)*100)+"%";document.getElementById("navCount").textContent=tickets.filter(t=>t.status==="open").length}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function openNew(){document.getElementById("newModal").classList.add("show");setTimeout(()=>document.getElementById("nSubject").focus(),100)}
function closeNew(){document.getElementById("newModal").classList.remove("show")}
function createTicket(){const t={id:Date.now(),name:document.getElementById("nName").value||"Testkunde",email:document.getElementById("nEmail").value||"kunde@example.com",subject:document.getElementById("nSubject").value||"Neue Anfrage",body:document.getElementById("nBody").value||"Keine Nachricht",status:"open",ai:false};Object.assign(t,classify(t));tickets.unshift(t);save();closeNew();render();toast("Neue Test-E-Mail erstellt")}
function openDetail(id){selected=tickets.find(t=>t.id===id);if(!selected)return;const t=selected;document.getElementById("detailBox").innerHTML=`<h2>${esc(t.subject)}</h2><div class="sub">${esc(t.name)} · ${esc(t.email)}</div><div class="tags"><span class="tag ${t.priority}">${t.priority==="high"?"HOCH":t.priority==="mid"?"MITTEL":"NIEDRIG"}</span><span class="tag">${esc(t.category)}</span></div><div class="reply"><b>Nachricht</b><p>${esc(t.body)}</p></div><div class="ai"><b>🤖 KI-Analyse</b><div class="detailgrid"><div><small>Kategorie</small><br><strong>${esc(t.category)}</strong></div><div><small>Priorität</small><br><strong>${t.priority}</strong></div></div><p><b>Antwortentwurf:</b></p><pre style="white-space:pre-wrap;font-family:inherit">${esc(aiAnswer(t))}</pre></div><div class="actions"><button class="danger" onclick="deleteTicket()">Löschen</button><button class="secondary" onclick="closeDetail()">Schließen</button><button class="primary" onclick="answerTicket()">KI-Antwort übernehmen</button></div>`;document.getElementById("detailModal").classList.add("show")}
function closeDetail(){document.getElementById("detailModal").classList.remove("show")}
function answerTicket(){if(!selected)return;selected.status="answered";selected.ai=true;save();closeDetail();render();toast("KI-Antwort übernommen")}
function deleteTicket(){tickets=tickets.filter(t=>t.id!==selected.id);save();closeDetail();render();toast("Anfrage gelöscht")}
render();
</script>
</body></html>
